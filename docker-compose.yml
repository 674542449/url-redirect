services:
  url-redirect:
    # 预构建多架构镜像（自动识别并拉取 x86_64 / arm64 对应架构版本）
    # 如需在本地修改源码后重新构建，运行: docker compose up -d --build
    image: ghcr.io/674542449/url-redirect:latest
    build: .
    container_name: url-redirect
    restart: unless-stopped
    ports:
      # 默认映射宿主机 8080 端口（配合 Nginx / 宝塔 / 1Panel 反向代理到 127.0.0.1:8080）
      # 若服务器没有装 Nginx/面板，想直接通过 80 端口访问，可改为 "80:8080"
      - "${HOST_PORT:-8080}:8080"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - DB_PATH=/app/data/links.db
      - ADMIN_PATH=${ADMIN_PATH:-/admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      - ./data:/app/data
