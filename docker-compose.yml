services:
  url-redirect:
    # 预构建多架构镜像（自动识别并拉取 x86_64 / arm64 对应架构版本）
    # 如需在本地修改源码后重新构建，运行: docker compose up -d --build
    image: ghcr.io/674542449/url-redirect:latest
    build: .
    container_name: url-redirect
    restart: unless-stopped
    ports:
      # 默认仅监听 8080；若本机已有 Nginx/宝塔反代，也可改为 "127.0.0.1:${HOST_PORT:-8080}:8080" 彻底隐藏容器端口
      - "${HOST_PORT:-8080}:8080"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - DB_PATH=/app/data/links.db
      - ADMIN_PATH=${ADMIN_PATH:-/admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?请在 .env 或环境变量中设置至少 8 位的 ADMIN_PASSWORD 强密码}
    volumes:
      - ./data:/app/data
