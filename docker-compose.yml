services:
  url-redirect:
    build: .
    container_name: url-redirect
    restart: unless-stopped
    ports:
      # 默认映射宿主机 8080 端口（配合 Nginx / 宝塔 / 1Panel 反向代理到 127.0.0.1:8080）
      # 若服务器没有装 Nginx/面板，想直接通过 80 端口访问，可改为 "80:8080"
      - "${HOST_PORT:-8080}:8080"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - DB_PATH=/app/data/links.db
      - ADMIN_PATH=${ADMIN_PATH:-/admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      - ./data:/app/data
